name: V9 K-line validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: v9-kline-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install test-only IndexedDB shim
        run: npm install --no-save fake-indexeddb
      - name: Run K-line controller tests
        run: npm test
      - name: Run V9 static validation
        run: npm run validate
